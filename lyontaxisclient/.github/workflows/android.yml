name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon -PSUPABASE_URL="${{ secrets.SUPABASE_URL }}" -PSUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon -PSUPABASE_URL="${{ secrets.SUPABASE_URL }}" -PSUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
