name: LyonTaxis CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyon-taxis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyonadministrateur
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lyon_taxis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lyon_taxis_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lyon_taxis_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate --force

      - name: Lint PHP files
        shell: bash
        run: find app database routes bootstrap config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate routes and views
        run: |
          php artisan route:list --path=api
          php artisan view:cache

      - name: Run Laravel tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lyon_taxis_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyonadmin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lyonadmin/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_LYONTAXIS_API_URL: https://api.example.invalid/api/v1
        run: npm run build

  android-client:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyontaxisclient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile and test
        env:
          LYONTAXIS_API_URL: https://api.example.invalid/api/v1
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace -PLYONTAXIS_API_URL="$LYONTAXIS_API_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lyon-taxis-client-debug
          path: lyontaxisclient/app/build/outputs/apk/debug/*.apk

  android-driver:
    name: Android driver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyontaxischauffeur
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile and test
        env:
          LYONTAXIS_API_URL: https://api.example.invalid/api/v1
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace -PLYONTAXIS_API_URL="$LYONTAXIS_API_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lyon-taxis-driver-debug
          path: lyontaxischauffeur/app/build/outputs/apk/debug/*.apk
